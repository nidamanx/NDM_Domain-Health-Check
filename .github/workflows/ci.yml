name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Syntax
        run: bash -n ndm_domain-health-check.sh
      - name: ShellCheck
        run: shellcheck ndm_domain-health-check.sh
      - name: Embedded Python helpers compile
        run: |
          mkdir -p "$RUNNER_TEMP/py"
          awk -v dir="$RUNNER_TEMP/py" '
            /<<.PY.$/ {n++; f = sprintf("%s/helper%02d.py", dir, n); on = 1; next}
            /^PY$/ {on = 0; next}
            on {print > f}' ndm_domain-health-check.sh
          test "$(ls "$RUNNER_TEMP/py" | wc -l)" -gt 0
          python3 -m py_compile "$RUNNER_TEMP"/py/*.py
      - name: Version matches in every file
        # APP_VERSION and APP_RELEASE_DATE are the reference; on a tag push the tag must match too.
        run: |
          set -u
          ver=$(sed -n 's/^APP_VERSION="\(.*\)"$/\1/p' ndm_domain-health-check.sh)
          date=$(sed -n 's/^APP_RELEASE_DATE="\(.*\)"$/\1/p' ndm_domain-health-check.sh)
          echo "APP_VERSION=$ver APP_RELEASE_DATE=$date"
          fail=0
          expect() {  # file, what, found, wanted
            if [[ $3 != "$4" ]]; then
              echo "::error file=$1::$2 is '$3', expected '$4'"; fail=1
            fi
          }
          for f in README.md README.it.md; do
            expect "$f" "version badge" "$(sed -n 's/.*badge\/version-\([^-]*\)-informational.*/\1/p' "$f")" "$ver"
            expect "$f" "sample report header" "$(sed -n 's/^  NDM Domain Health Check (\(.*\))$/\1/p' "$f")" "$ver"
          done
          expect CITATION.cff "version" "$(sed -n 's/^version: "\(.*\)"$/\1/p' CITATION.cff)" "$ver"
          expect CITATION.cff "date-released" "$(sed -n 's/^date-released: "\(.*\)"$/\1/p' CITATION.cff)" "$date"
          expect CHANGELOG.md "latest release" "$(grep -m1 -E '^## \[[0-9]' CHANGELOG.md)" "## [$ver] - $date"
          if [[ $GITHUB_REF_TYPE == tag ]]; then
            expect ndm_domain-health-check.sh "tag" "$GITHUB_REF_NAME" "v$ver"
          fi
          exit "$fail"

  smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install dig
        run: sudo apt-get update && sudo apt-get install -y dnsutils
      - name: Version and help
        run: |
          ./ndm_domain-health-check.sh --version
          ./ndm_domain-health-check.sh --help
      - name: Requirements
        run: ./ndm_domain-health-check.sh --requirements
      - name: Invalid domain exits with 1
        run: |
          rc=0; ./ndm_domain-health-check.sh 'not a domain' || rc=$?
          test "$rc" -eq 1
      - name: Invalid option exits with 2
        run: |
          rc=0; ./ndm_domain-health-check.sh --nope || rc=$?
          test "$rc" -eq 2
      - name: Conflicting modes exit with 2
        run: |
          rc=0; ./ndm_domain-health-check.sh --active --passive example.com || rc=$?
          test "$rc" -eq 2
      - name: -A with an all-uppercase domain (CAPS LOCK) exits with 2
        run: |
          rc=0; ./ndm_domain-health-check.sh -A EXAMPLE.COM || rc=$?
          test "$rc" -eq 2
